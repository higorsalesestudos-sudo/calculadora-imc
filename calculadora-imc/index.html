<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora de IMC</title>
</head>
<body>
    <div class="container">

        <header class="cabecalho">
            <h1>Calculadora - IMC</h1>
        </header>

        <main class="principal">
            <form method="get">
               
                <div class="campo">
                    <label for="inputNome">Nome:</label>
                    <input type="text" name="input-nome" id="inputNome">
                </div class="campo">
                <div class="campo">
                    <label for="inputAltura">Altura:</label>
                    <input type="number" name="input-altura" id="inputAltura">
                </div class="campo">
                <div class="campo">
                    <label for="inputPeso">Peso:</label>
                    <input type="number" name="input-peso" id="inputPeso">
                </div class="campo">
                <button type="submit" id="btnCalcular">Calcular</button>

            </form>
        </main>

        <footer class="rodape">
            <div class="display" id="displayResultado"></div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
